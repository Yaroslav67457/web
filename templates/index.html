<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Chat</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            max-width: 1100px;
            width: 100%;
            height: 85vh;
            background: rgba(22, 32, 42, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: rgba(10, 20, 28, 0.9);
            padding: 1rem 1.8rem;
            border-bottom: 1px solid rgba(72, 187, 255, 0.3);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }
        .title {
            color: #b9e6ff;
            font-weight: 700;
            font-size: 1.45rem;
        }
        .title span {
            background: #2c5a7a;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
        }
        .user-panel {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nick-input {
            background: #1e2f3c;
            border: 1px solid #3f6b88;
            padding: 8px 14px;
            border-radius: 60px;
            color: #eef5ff;
            outline: none;
            width: 150px;
        }
        .btn-set {
            background: #2c6e9e;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-set:hover {
            background: #1f8ad0;
        }
        .status-badge {
            font-size: 0.8rem;
            background: #1f3e4e;
            padding: 5px 12px;
            border-radius: 30px;
            color: #aad4f5;
        }
        .notif-toggle {
            background: transparent;
            border: none;
            padding: 6px 8px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 1.25rem;
            transition: 0.2s;
        }
        .notif-toggle:hover {
            background: rgba(255,255,255,0.1);
        }
        .notif-wrapper {
            position: relative;
        }
        .notif-menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: min(340px, calc(100vw - 32px));
            padding: 18px;
            background: #172936;
            border: 1px solid #3f627b;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
            color: #dcecf7;
        }
        .notif-menu[hidden] {
            display: none;
        }
        .notif-menu-title {
            margin-bottom: 14px;
            font-size: 1rem;
            font-weight: 600;
        }
        .notif-all-button {
            width: 100%;
            margin-bottom: 14px;
            padding: 9px 12px;
            border: 1px solid #3f627b;
            border-radius: 9px;
            background: #24475c;
            color: #eaf7ff;
            cursor: pointer;
            text-align: left;
            font-size: 0.85rem;
        }
        .notif-all-button:hover {
            background: #2d607d;
        }
        .notif-add {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .notif-add input {
            min-width: 0;
            flex: 1;
            padding: 7px 9px;
            border: 1px solid #3f627b;
            border-radius: 8px;
            background: #1f2f3a;
            color: white;
            outline: none;
        }
        .notif-add button,
        .notif-user-remove {
            border: none;
            border-radius: 8px;
            background: #2c7cb6;
            color: white;
            cursor: pointer;
        }
        .notif-add button {
            padding: 0 10px;
        }
        .notif-users {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }
        .notif-user {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 34px;
            padding: 6px 0;
            font-size: 0.82rem;
            border-bottom: 1px solid rgba(145, 190, 215, 0.2);
        }
        .notif-user:last-child {
            border-bottom: none;
        }
        .notif-user-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .notif-user-remove {
            padding: 3px 8px;
            background: #5a4a4a;
        }
        .notif-empty {
            color: #9bb8cf;
            font-size: 0.75rem;
            font-style: italic;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            width: fit-content;
            animation: fadeSlide 0.2s ease-out;
        }
        .message-own {
            align-self: flex-end;
        }
        .message-other {
            align-self: flex-start;
        }
        .message-bubble {
            padding: 10px 16px;
            border-radius: 24px;
            background: #1e2f3b;
            color: #eef2f5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message-own .message-bubble {
            background: #1f6390;
            border-bottom-right-radius: 5px;
        }
        .message-other .message-bubble {
            background: #2a3f4c;
            border-bottom-left-radius: 5px;
        }
        .message-meta {
            font-size: 0.7rem;
            margin: 4px 10px 2px 10px;
            display: flex;
            gap: 12px;
            color: #9bb8cf;
        }
        .message-name {
            font-weight: 600;
        }
        .chat-image {
            max-width: 250px;
            max-height: 200px;
            border-radius: 12px;
            margin-top: 6px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .system-message {
            text-align: center;
            font-size: 0.75rem;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 50px;
            width: fit-content;
            margin: 5px auto;
            color: #bcd0df;
            font-style: italic;
        }
        .input-panel {
            background: #0d1a24;
            padding: 16px 22px;
            border-top: 1px solid #2f556b;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message-input {
            width: 100%;
            background: #1f2f3a;
            border: none;
            padding: 14px 20px;
            border-radius: 24px;
            color: white;
            font-size: 1rem;
            outline: none;
            border: 1px solid #3f627b;
            resize: vertical;
            font-family: inherit;
            white-space: pre-wrap;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .file-label {
            background: #2c6e9e;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-label:hover {
            background: #1f8ad0;
        }
        .send-btn {
            background: #2c7cb6;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 60px;
            cursor: pointer;
            color: white;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-link {
            color: #A2E4FA;
            text-decoration: underline;
            cursor: pointer;
        }
        .chat-link:hover {
            color: #9acaff;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="title">Чат на Python!</div>
        <div class="user-panel">
            <input type="text" id="nickname" class="nick-input" placeholder="Ваш ник" maxlength="24">
            <button id="setNickBtn" class="btn-set">✅ Установить</button>
            <div class="status-badge" id="status">🔄 Соединение...</div>
            <div class="notif-wrapper">
                <button id="notifToggle" class="notif-toggle" type="button"
                        aria-label="Настройки уведомлений" title="Настройки уведомлений">🔔</button>
                <div id="notifMenu" class="notif-menu" hidden>
                    <div class="notif-menu-title">Настройки уведомлений</div>
                    <button id="notifAllToggle" class="notif-all-button" type="button"></button>
                    <div class="notif-add">
                        <input id="notifNickInput" type="text" maxlength="24" placeholder="Ник пользователя">
                        <button id="notifAddBtn" type="button">+</button>
                    </div>
                    <div id="notifUsers" class="notif-users"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="messages-area" id="messages"></div>
    <div class="input-panel">
        <div class="input-wrapper">
            <textarea id="messageInput" class="message-input" rows="1" placeholder="Сообщение..."></textarea>
            <div class="toolbar">
                <label class="file-label">
                    📷 Отправить скриншот
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </label>
                <button id="sendBtn" class="send-btn">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    const socket = io({ transports: ['websocket', 'polling'] });
    let currentNick = '';

    const messagesDiv = document.getElementById('messages');
    const nickInput = document.getElementById('nickname');
    const setNickBtn = document.getElementById('setNickBtn');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusSpan = document.getElementById('status');
    const imageInput = document.getElementById('imageInput');
    const notifToggle = document.getElementById('notifToggle');
    const notifMenu = document.getElementById('notifMenu');
    const notifNickInput = document.getElementById('notifNickInput');
    const notifAddBtn = document.getElementById('notifAddBtn');
    const notifUsers = document.getElementById('notifUsers');
    const notifAllToggle = document.getElementById('notifAllToggle');

    const MAX_FILE_SIZE_MB = 7;
    const MAX_FILE_SIZE_BYTES = MAX_FILE_SIZE_MB * 1024 * 1024;

    // ---------- УВЕДОМЛЕНИЯ ----------
    // Состояние уведомлений (по умолчанию true, если не сохранено)
    let notificationsEnabled = localStorage.getItem('chat_notifications_enabled') !== 'false';
    let notificationUsers = {};
    try {
        notificationUsers = JSON.parse(
            localStorage.getItem('chat_notification_users') || '{}'
        );
        if (!notificationUsers || typeof notificationUsers !== 'object' || Array.isArray(notificationUsers)) {
            notificationUsers = {};
        }
    } catch {
        notificationUsers = {};
    }

    function updateNotifButton() {
        notifToggle.textContent = '🔔';
        notifAllToggle.textContent = notificationsEnabled
            ? '🔔 Получать все уведомления'
            : '🔕 Не получать уведомления';
    }
    updateNotifButton();

    function saveNotificationUsers() {
        localStorage.setItem('chat_notification_users', JSON.stringify(notificationUsers));
    }

    notifAllToggle.addEventListener('click', () => {
        notificationsEnabled = !notificationsEnabled;
        localStorage.setItem('chat_notifications_enabled', notificationsEnabled);
        updateNotifButton();
    });

    function renderNotificationUsers() {
        notifUsers.innerHTML = '';
        const names = Object.keys(notificationUsers);
        if (!names.length) {
            notifUsers.innerHTML = '<div class="notif-empty">Пользователи ещё не добавлены</div>';
            return;
        }
        names.forEach(name => {
            const row = document.createElement('div');
            row.className = 'notif-user';
            row.innerHTML = `
                <span class="notif-user-name">${escapeHtml(name)}</span>
                <label title="Получать уведомления">
                    <input type="checkbox" ${notificationUsers[name] ? 'checked' : ''}>
                </label>
                <button class="notif-user-remove" type="button" title="Удалить">×</button>
            `;
            row.querySelector('input').addEventListener('change', event => {
                notificationUsers[name] = event.target.checked;
                saveNotificationUsers();
            });
            row.querySelector('.notif-user-remove').addEventListener('click', () => {
                delete notificationUsers[name];
                saveNotificationUsers();
                renderNotificationUsers();
            });
            notifUsers.appendChild(row);
        });
    }

    function addNotificationUser() {
        const name = notifNickInput.value.trim();
        if (!name) return;
        const existingName = Object.keys(notificationUsers)
            .find(savedName => savedName.toLowerCase() === name.toLowerCase());
        if (!existingName) {
            notificationUsers[name] = true;
            saveNotificationUsers();
            renderNotificationUsers();
        }
        notifNickInput.value = '';
        notifNickInput.focus();
    }

    renderNotificationUsers();

    notifToggle.addEventListener('click', function() {
        notifMenu.hidden = !notifMenu.hidden;
    });

    notifAddBtn.addEventListener('click', addNotificationUser);
    notifNickInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') addNotificationUser();
    });

    // Запрос разрешения при загрузке
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    function showNotification(title, body) {
        if (!notificationsEnabled) return;
        const savedName = Object.keys(notificationUsers)
            .find(name => name.toLowerCase() === title.toLowerCase());
        if (savedName && !notificationUsers[savedName]) return;
        if (!('Notification' in window)) return;
        if (Notification.permission === 'granted') {
            if (document.hidden) {
                const notification = new Notification(title, {
                    body: body,
                    icon: '/msg.ico'
                });
                setTimeout(() => notification.close(), 3500);
            }
        }
    }
    // ---------------------------------

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeAttr(str) {
        return str.replace(/"/g, '&quot;');
    }

    function renderLinks(text) {
        let escaped = escapeHtml(text);
        const linkRegex = /(\(([^)]*)\)\[([^\]]*)\])|(https?:\/\/[^\s]+)/g;
        return escaped.replace(linkRegex, function(match, complex, name, url, simpleUrl) {
            if (complex) {
                let linkText = name.trim() || url;
                let href = escapeAttr(url);
                return `<a href="${href}" target="_blank" class="chat-link">${linkText}</a>`;
            } else if (simpleUrl) {
                let href = escapeAttr(simpleUrl);
                return `<a href="${href}" target="_blank" class="chat-link">${simpleUrl}</a>`;
            }
            return match;
        });
    }

    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'system-message';
        div.textContent = text;
        messagesDiv.appendChild(div);
        scrollToBottom();
    }

    function addMessage(username, text, imageBase64, timestamp, isOwn = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isOwn ? 'message-own' : 'message-other'}`;
        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.innerHTML = `<span class="message-name">${escapeHtml(username)}</span><span>${timestamp}</span>`;
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';

        if (text) {
            const textDiv = document.createElement('div');
            textDiv.style.whiteSpace = 'pre-wrap';
            textDiv.innerHTML = renderLinks(text);
            bubble.appendChild(textDiv);
        }
        if (imageBase64) {
            const img = document.createElement('img');
            img.src = imageBase64;
            img.className = 'chat-image';
            img.alt = 'изображение';
            img.onclick = () => window.open(imageBase64, '_blank');
            bubble.appendChild(img);
        }
        msgDiv.appendChild(meta);
        msgDiv.appendChild(bubble);
        messagesDiv.appendChild(msgDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessageWithImage(imageBase64 = null) {
        if (!currentNick) {
            addSystemMessage('Сначала установите никнейм!');
            return;
        }
        let text = messageInput.value;
        if (text.trim() === '' && !imageBase64) return;

        socket.emit('send_message', { text: text, image: imageBase64 });
        messageInput.value = '';
        messageInput.style.height = 'auto';
        messageInput.focus();
    }

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > MAX_FILE_SIZE_BYTES) {
            addSystemMessage(`❌ Файл слишком большой! Максимальный размер: ${MAX_FILE_SIZE_MB} МБ.`);
            imageInput.value = '';
            return;
        }

        const reader = new FileReader();
        reader.onload = function(ev) {
            const base64 = ev.target.result;
            sendMessageWithImage(base64);
            imageInput.value = '';
        };
        reader.onerror = function() {
            addSystemMessage('❌ Ошибка при чтении файла');
            imageInput.value = '';
        };
        reader.readAsDataURL(file);
    });

    // --- Socket events ---
    socket.on('connect', () => {
        statusSpan.innerHTML = '🟢 Онлайн';
        statusSpan.style.color = '#b4f0b0';
        addSystemMessage('Соединение с сервером установлено');
    });
    socket.on('disconnect', () => {
        statusSpan.innerHTML = '🔴 Офлайн';
        statusSpan.style.color = '#ffaeae';
        addSystemMessage('Соединение потеряно. Перезагрузите страницу.');
    });
    socket.on('system', (data) => {
        addSystemMessage(data.msg);
    });
    socket.on('new_message', (data) => {
        const isOwn = (data.username === currentNick);
        addMessage(data.username, data.text, data.image, data.timestamp, isOwn);

        // Показ уведомления (если не от себя и включено)
        if (!isOwn) {
            let body = data.text ? data.text : (data.image ? '📷 Изображение' : '');
            if (body.length > 200) body = body.slice(0, 200) + '…';
            showNotification(data.username, body);
        }
    });
    socket.on('chat_history', (history) => {
        if (history && history.length) {
            history.forEach(msg => {
                const isOwn = (msg.username === currentNick);
                addMessage(msg.username, msg.text, msg.image, msg.timestamp, isOwn);
            });
            addSystemMessage(`📜 Загружено ${history.length} сообщений`);
        }
    });
    socket.on('nick_success', (data) => {
        currentNick = data.nick;
        nickInput.value = currentNick;
        addSystemMessage(`✅ Ваш ник: ${currentNick}`);
    });
    socket.on('nick_failed', (data) => {
        addSystemMessage(`❌ Ошибка: ${data.reason}`);
    });

    // --- UI handlers ---
    function setNick() {
        let nick = nickInput.value.trim();
        if (!nick) {
            addSystemMessage('Введите никнейм');
            return;
        }
        socket.emit('set_nick', { nick: nick });
    }

    sendBtn.addEventListener('click', () => sendMessageWithImage(null));

    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessageWithImage(null);
        }
    });

    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    setNickBtn.addEventListener('click', setNick);
    nickInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') setNick(); });

    const saved = localStorage.getItem('python_chat_nick');
    if (saved) {
        nickInput.value = saved;
        setTimeout(() => setNick(), 500);
    }
    socket.on('nick_success', (data) => {
        localStorage.setItem('python_chat_nick', data.nick);
    });
</script>
</body>
</html>
